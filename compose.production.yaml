services:
  db:
    image: postgres:16-alpine
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    env_file: ${APP_ENV_FILE:-.env.production}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file: ${APP_ENV_FILE:-.env.production}
    command: >-
      sh -c "python manage.py check --deploy &&
      python manage.py production_check &&
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile - --error-logfile -"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready/', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build: .
    env_file: ${APP_ENV_FILE:-.env.production}
    command: celery -A config worker -l info --concurrency=2
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

  beat:
    build: .
    env_file: ${APP_ENV_FILE:-.env.production}
    command: celery -A config beat -l info
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL}/api/v1
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      INTERNAL_API_URL: http://web:8000/api/v1
      NEXT_PUBLIC_SITE_URL: ${FRONTEND_URL}
      AUTH_COOKIE_SECURE: "true"
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
