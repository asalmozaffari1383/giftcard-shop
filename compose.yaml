name: alisan-shop

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alisan_shop
      POSTGRES_USER: alisan_shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alisan_shop -d alisan_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    environment: &app_environment
      DEBUG: "true"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      POSTGRES_DB: alisan_shop
      POSTGRES_USER: alisan_shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      INVENTORY_FERNET_KEYS: ${INVENTORY_FERNET_KEYS:?Set INVENTORY_FERNET_KEYS in .env}
      INVENTORY_FINGERPRINT_KEY: ${INVENTORY_FINGERPRINT_KEY:?Set INVENTORY_FINGERPRINT_KEY in .env}
      PUBLIC_BASE_URL: http://localhost:8001
      FRONTEND_URL: http://localhost:3001
      ALLOWED_HOSTS: localhost,127.0.0.1,web
      CORS_ALLOWED_ORIGINS: http://localhost:3001
      CSRF_TRUSTED_ORIGINS: http://localhost:3001
      DEVELOPMENT_OTP_CODE: ${DEVELOPMENT_OTP_CODE:-}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-zarinpal}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-true}
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready/', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    command: celery -A config worker -l info
    environment: *app_environment
    depends_on:
      web:
        condition: service_healthy

  beat:
    build: .
    command: celery -A config beat -l info
    environment: *app_environment
    depends_on:
      web:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
        NEXT_PUBLIC_SITE_URL: http://localhost:3001
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
      INTERNAL_API_URL: http://web:8000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3001
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
